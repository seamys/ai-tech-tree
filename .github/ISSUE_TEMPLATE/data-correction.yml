name: Data correction
description: Report a wrong date, fact, translation or link
title: "[fix] "
labels: ["data", "correction"]
body:
  - type: input
    id: node
    attributes:
      label: Node
      description: Title or id (shown in the node's detail panel).
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What it should be, with a source
    validations:
      required: true
