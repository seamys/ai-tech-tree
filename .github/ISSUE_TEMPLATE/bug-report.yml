name: Bug report
description: Something on the site doesn't work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: "Chrome 142 on macOS / Safari on iPhone"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or console errors
