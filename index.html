<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生成式 AI 技术路线树</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --bg2:#111821; --line:#1e2a36; --text:#d7e1ea; --dim:#7d8da0; --faint:#3a4a5c;
  --accent:#4fd1c5; --warn:#f6ad55; --panel:#0f151d;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Noto Sans SC',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:rgba(11,15,20,.92);border-bottom:1px solid var(--line);z-index:10;backdrop-filter:blur(6px)}
header h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap;letter-spacing:.5px}
header h1 span{font-family:var(--mono);color:var(--accent);font-weight:400;font-size:12px;margin-left:8px}
.search{flex:0 1 260px;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 10px;font:13px var(--sans);outline:none}
.search:focus{border-color:var(--accent)}
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 10px;font:12px var(--sans);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.warn{border-color:#6b4a22;color:var(--warn)}
.spacer{flex:1}
#legend{position:fixed;top:56px;left:0;right:0;height:38px;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:7px 16px;z-index:9;background:rgba(11,15,20,.92);border-bottom:1px solid var(--line);scrollbar-width:none}
#legend::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);background:rgba(17,24,33,.85);cursor:pointer;color:var(--text);user-select:none}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.off{opacity:.6}
.chip.tagon{border-color:var(--accent);color:var(--accent)}
.divider{flex-shrink:0;white-space:nowrap;font-size:11px;color:#8a7356;align-self:center;padding:0 4px 0 8px}
svg{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
svg.drag{cursor:grabbing}
.yearline{stroke:var(--line);stroke-width:1}
.yearlabel{fill:var(--faint);font:600 12px var(--mono)}
.trunk{stroke:#2f4256;stroke-width:10;stroke-linecap:round}
.limb{fill:none;stroke-width:4;stroke-linecap:round;opacity:.55}
.twig{stroke-width:1.2;opacity:.5}
.lanelabel{font:700 14px var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:5px}
.node{cursor:pointer}
.node .shape{stroke:var(--bg);stroke-width:2}
.node.constraint .shape{stroke:#1a1208;stroke-width:2}
.soil{fill:#1a140d;opacity:.55}
.groundline{stroke:#6b5233;stroke-width:2;stroke-dasharray:10 6}
.groundlabel{fill:#a88c66;paint-order:stroke;stroke:var(--bg);stroke-width:4px;font:600 12px var(--sans);letter-spacing:1px}
.rootlimb{stroke-dasharray:1 0}
.node text{font:12px var(--sans);fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.node .date{font:10px var(--mono);fill:var(--dim)}
.node.minor text{font-size:11px;fill:#b5c2cf}
.node.candidate .shape{stroke:var(--warn);stroke-width:2;stroke-dasharray:3 2}
.node.dim{opacity:.15}
.node.hit .shape{stroke:#fff;stroke-width:3}
.node.sel .shape{stroke:#fff;stroke-width:3}
.zoomed-out .node.minor text{display:none}
.zoomed-out .node .date{display:none}
.link{fill:none;stroke-width:1.6;opacity:.8}
.link.child{stroke-dasharray:5 4}
.link.bg{opacity:.14;stroke-width:1}
.link.bg.faint{opacity:.05}
.link.direct{stroke-width:2.4;opacity:.95}
.link.indirect{stroke-width:1.5;opacity:.6}
.node.fade{opacity:.18}
.node.chain text{fill:#fff}
.root text{font:700 16px var(--sans);fill:var(--text)}
#panel{position:fixed;top:56px;right:0;bottom:0;width:380px;background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .2s;z-index:11;overflow-y:auto;padding:18px 18px 40px}
#panel.open{transform:none}
#panel .close{position:absolute;top:12px;right:12px}
#panel h2{font-size:18px;margin:4px 30px 6px 0}
.meta{font:12px var(--mono);color:var(--dim);margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font:11px var(--sans);padding:2px 8px;border-radius:4px;border:1px solid var(--line)}
.tag.cand{color:var(--warn);border-color:#6b4a22}
.tag.ok{color:var(--accent);border-color:#1f4e4a}
#panel p{font-size:13px;line-height:1.7;color:#c3cfdb}
#panel h3{font-size:11px;letter-spacing:1px;color:var(--dim);margin:18px 0 8px;font-weight:500;text-transform:uppercase}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel .chip{font-size:12px}
#panel a{color:var(--accent);word-break:break-all;font-size:12px}
pre{background:#0a0e13;border:1px solid var(--line);border-radius:6px;padding:10px;font:11px/1.5 var(--mono);color:#9fb3c6;overflow-x:auto;white-space:pre-wrap}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--bg2)}
.qitem b{font-size:14px}
.qitem .why{font-size:12px;color:var(--dim);margin:6px 0 8px;line-height:1.6}
.qitem .row{display:flex;gap:6px}
.feed{font-size:12px;border-left:2px solid var(--line);padding:2px 0 8px 10px;margin-left:4px;cursor:pointer}
.feed .t{font-family:var(--mono);color:var(--dim);font-size:11px}
#zoomctl{position:fixed;left:16px;bottom:16px;display:flex;gap:6px;z-index:9}
#hint{position:fixed;left:16px;bottom:58px;font:11px var(--sans);color:var(--dim);background:rgba(11,15,20,.9);padding:4px 8px;border-radius:4px;z-index:9;transition:opacity .6s}
#hint.gone{opacity:0;pointer-events:none}
#overlay{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8;cursor:default}
.ov-years{fill:rgba(11,15,20,.92)}
.ov-year{fill:var(--dim);font:600 11px var(--mono)}
.ov-lane{font:700 12px var(--sans)}
.zonehead{pointer-events:auto;cursor:pointer}
.ov-zone{font:700 13px var(--sans)}
.ov-zone-sub{font:400 11px var(--sans);fill:var(--dim)}
.ov-layer{font:600 11px var(--mono);letter-spacing:.5px;opacity:.85;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.node.untag{opacity:.12}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14212c;border:1px solid var(--accent);color:var(--text);
  padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
@media (max-width:720px){
  header{gap:8px;padding:0 10px}
  header h1{font-size:13px}
  header h1 span,.long{display:none}
  .search{flex:1 1 60px;min-width:0;padding:6px 8px;font-size:12px}
  .btn{padding:6px 8px}
  #btnLinks{display:none}
  #zoomctl .btn{padding:6px 7px}
  #panel{width:100%;top:auto;height:62%;border-left:none;border-top:1px solid var(--line);transform:translateY(100%)}
  #panel.open{transform:none}
}

.tick{stroke:var(--line);stroke-width:1}
.tick.m{stroke:#141c25}
.tick.q{stroke:#18222d}
.tick.hide{display:none}
.ov-year.minor{fill:#56677a;font-weight:400}
.nowline{stroke:#ff5d73;stroke-width:2;stroke-dasharray:2 3;opacity:.9}
.futurezone{fill:#ff5d73;opacity:.035}
.ov-now rect{fill:#2a0f15;stroke:#ff5d73}
.ov-now text{fill:#ffb3be;font:600 11px var(--mono)}
.ov-now circle{fill:#ff5d73;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.limb-stale{fill:none;stroke-width:2;stroke-dasharray:3 6;opacity:.35}
.pulse{fill:none;stroke:#ff5d73;stroke-width:2;animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.node.recent .shape{stroke:#ff9aa8;stroke-width:2}
.node.future .shape{fill-opacity:.15;stroke-dasharray:2 2;stroke-width:2}
.node.notyet{opacity:.05;pointer-events:none}
.badge-fresh{fill:#ff5d73;font:700 9px var(--mono)}
#timebar{position:fixed;right:16px;bottom:14px;z-index:9;display:flex;align-items:center;gap:8px;
  background:rgba(15,21,29,.95);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:12px var(--mono);color:var(--dim)}
#timebar input{width:min(36vw,360px);accent-color:#ff5d73}
#timebar b{color:#ffb3be;font-weight:600;min-width:86px;display:inline-block}
#lodbadge{font:11px var(--sans);color:var(--dim);align-self:center;padding:0 6px;white-space:nowrap}
#lodbadge b{color:var(--accent)}
@media (max-width:720px){
  #timebar{right:8px;bottom:58px}
  #btnTime{display:none}
  #timebar input{width:150px}
  #lodbadge{display:none}
}
</style>
</head>
<body>
<header>
  <h1><em class="long" style="font-style:normal" id="ttl1">生成式 AI </em><b id="ttl2" style="font-weight:inherit">技术路线树</b><span id="ttlv">v0.5</span></h1>
  <input class="search" id="search" placeholder="搜索节点">
  <div class="spacer"></div>
  <button class="btn" id="btnLang" style="font-weight:600">EN</button><button class="btn" id="btnTime" title="切换时间轴比例">时间：<span id="tmode">聚焦近期</span></button><button class="btn" id="btnLinks">依赖连线</button>
  <button class="btn" id="btnFeed"><span class="long">更新</span>动态</button>
  <button class="btn warn" id="btnQueue"><span class="long">待</span>审核 <b id="qcount">0</b></button>
</header>
<div id="legend"></div>
<svg id="svg"><g id="world"></g></svg>
<svg id="overlay"><rect class="ov-years" x="0" y="94" width="100%" height="22"></rect><g id="ovYears"></g><g id="ovLanes"></g></svg>
<div id="hint">滚轮上下移动 · Ctrl+滚轮或双指捏合缩放，越放大越细 · 点节点看详情</div>
<div id="zoomctl">
  <button class="btn" data-z="1.25">＋</button><button class="btn" data-z="0.8">－</button><button class="btn" data-z="0" id="fitBtn">适配</button><button class="btn" id="toRoots">⇣ 根系</button><button class="btn" id="toTop">⇡ 树冠</button><span id="lodbadge"></span>
</div>
<div id="timebar"><button class="btn" id="play">▶ 回放</button><input type="range" id="scrub" min="0" max="1000" value="1000"><b id="scrubLabel">现在</b></div>
<aside id="panel"><button class="btn close" id="closePanel">✕</button><div id="pbody"></div></aside>
<div id="toast"></div>

<script>
/* ===== 数据结构（Agent 读写的就是这个格式） =====
 Node = {
   id, title, date:"YYYY" | "YYYY-MM" | "YYYY-MM-DD", branch, parents:[id...],  // 多父节点 → 有向图
   level: 1 里程碑 | 2 重要 | 3 细节    // 决定缩放到哪一级才出现
   kind: "paper" | "release" | "event" | "constraint" | "upcoming",
   summary, source, url, criteria:[...], tags:[...],
   status: "verified" | "candidate", added_by, added_at, confidence
 }
*/
const ZONES = [
  {id:"value",    name:"价值区", color:"#d6bcfa", desc:"应用、模型服务与工具"},
  {id:"intel",    name:"智能区", color:"#4fd1c5", desc:"基础模型与数据"},
  {id:"compute",  name:"算力区", color:"#e8c468", desc:"系统软件、数据中心、芯片", ground:true},
  {id:"physical", name:"物理区", color:"#c08457", desc:"半导体制造、能源、矿产", ground:true},
];
// 10 层（L9 最上，L0 最下）
const LAYERS = [
  {id:"L9", name:"应用", zone:"value"},
  {id:"L8", name:"模型服务与工具", zone:"value"},
  {id:"L7", name:"基础模型", zone:"intel"},
  {id:"L6", name:"数据", zone:"intel"},
  {id:"L5", name:"系统软件", zone:"compute"},
  {id:"L4", name:"数据中心与云", zone:"compute"},
  {id:"L3", name:"芯片与系统", zone:"compute"},
  {id:"L2", name:"半导体制造", zone:"physical"},
  {id:"L1", name:"能源与电力", zone:"physical"},
  {id:"L0", name:"矿产与材料", zone:"physical"},
];
// 每层下的分支（泳道）
const BRANCHES = [
  {id:"consumer", name:"消费级产品", color:"#f687b3", layer:"L9"},
  {id:"devent",   name:"开发者与企业", color:"#b794f4", layer:"L9"},
  {id:"science",  name:"科学发现", color:"#68d391", layer:"L9"},
  {id:"embodied", name:"具身智能", color:"#76e4f7", layer:"L9"},
  {id:"agent",    name:"Agent 与工具", color:"#b794f4", layer:"L8"},
  {id:"serve",    name:"微调与推理服务", color:"#a0aec0", layer:"L8"},
  {id:"eval",     name:"评测基准", color:"#fbd38d", layer:"L8"},
  {id:"found", name:"生成范式", color:"#f687b3", layer:"L7"},
  {id:"arch",  name:"网络架构", color:"#63b3ed", layer:"L7"},
  {id:"llm",   name:"语言模型", color:"#4fd1c5", layer:"L7"},
  {id:"llm-open", name:"开源权重", sub:"llm", layer:"L7"},
  {id:"llm-ctx",  name:"长上下文", sub:"llm", layer:"L7"},
  {id:"align", name:"对齐与后训练", color:"#9f7aea", layer:"L7"},
  {id:"reason",name:"推理", color:"#f6e05e", layer:"L7"},
  {id:"reason-tts", name:"推理时扩展", sub:"reason", layer:"L7"},
  {id:"image", name:"图像生成", color:"#fc8181", layer:"L7"},
  {id:"image-ctrl", name:"可控生成与编辑", sub:"image", layer:"L7"},
  {id:"video", name:"视频生成", color:"#ed8936", layer:"L7"},
  {id:"video-world", name:"世界模型", sub:"video", layer:"L7"},
  {id:"audio", name:"音频与语音", color:"#68d391", layer:"L7"},
  {id:"mm",    name:"多模态", color:"#76e4f7", layer:"L7"},
  {id:"data",  name:"语料、数据规律与约束", color:"#81e6d9", layer:"L6"},
  {id:"sw",    name:"训练与计算软件栈", color:"#90cdf4", layer:"L5"},
  {id:"infra", name:"数据中心与集群", color:"#d6a35c", layer:"L4"},
  {id:"infra-gw", name:"吉瓦级园区", sub:"infra", layer:"L4"},
  {id:"chip",  name:"芯片与系统", color:"#e8c468", layer:"L3"},
  {id:"chip-asic", name:"定制 ASIC", sub:"chip", layer:"L3"},
  {id:"fab",   name:"制造、封装与存储", color:"#c08457", layer:"L2"},
  {id:"energy",name:"能源与电力", color:"#f6ad55", layer:"L1"},
  {id:"mineral",name:"矿产与材料", color:"#a78b6d", layer:"L0"},
];
// 横切维度：不单独成层，作为标签
const TAGS = [{id:"policy", name:"政策与监管"}, {id:"capital", name:"资本"}, {id:"safety", name:"安全与对齐"}];
const brOf = id => BRANCHES.find(b => b.id === id);
const layerOf = n => LAYERS.find(l => l.id === brOf(n.branch).layer);
const zoneOf = n => ZONES.find(z => z.id === layerOf(n).zone);

const ax = id => "https://arxiv.org/abs/" + id;
const N = (id,title,date,branch,parents,o={}) => Object.assign({id,title,date,branch,parents,major:false,kind:"paper",
  summary:"",source:"",url:"",criteria:[],tags:[],status:"verified",added_by:"human",added_at:"2026-11-19",confidence:1},o);

let NODES = [
 // 生成范式
 N("vae","VAE 变分自编码器","2013-12","found",[],{major:true,url:ax("1312.6114"),source:"Kingma & Welling",summary:"用变分推断训练带潜变量的生成模型，后来成为潜空间扩散模型的压缩器。",criteria:["新范式","被广泛沿用"]}),
 N("gan","GAN 生成对抗网络","2014-06","found",[],{major:true,url:ax("1406.2661"),source:"Goodfellow 等",summary:"生成器与判别器对抗训练，开启了高质量图像生成的一个时代。",criteria:["新范式"]}),
 N("ddpm","DDPM 去噪扩散模型","2020-06","found",["vae"],{major:true,url:ax("2006.11239"),source:"Ho 等",summary:"把扩散过程做成实用的图像生成方法，质量追平并超越 GAN，成为图像/视频生成的主流范式。",criteria:["新范式","质量 SOTA"]}),
 N("cfg","Classifier-Free Guidance","2022-07","found",["ddpm"],{url:ax("2207.12598"),source:"Ho & Salimans",summary:"不需要额外分类器即可做条件引导，几乎所有文生图模型都在用。",criteria:["被广泛沿用"]}),
 N("flowmatch","Flow Matching","2022-10","found",["ddpm"],{url:ax("2210.02747"),source:"Lipman 等",summary:"用回归速度场的方式训练连续流模型，成为新一代图像/视频模型的训练目标之一。",criteria:["新训练目标"],status:"candidate",added_by:"agent",added_at:"2026-11-19",confidence:0.71,agent_reason:"近期多个图像/视频模型技术报告采用此训练目标，建议挂在『生成范式』下，父节点 DDPM。"}),
 // 网络架构
 N("transformer","Transformer","2017-06","arch",["p100"],{major:true,url:ax("1706.03762"),source:"Vaswani 等",summary:"纯注意力架构，几乎所有现代生成模型的共同祖先。",criteria:["奠基性架构"]}),
 N("scaling","Scaling Laws","2020-01","arch",["transformer"],{major:true,url:ax("2001.08361"),source:"Kaplan 等",summary:"发现损失随参数、数据、算力呈幂律下降，直接推动了大模型路线。",criteria:["改变研发方向"]}),
 N("switch","Switch Transformer (MoE)","2021-01","arch",["transformer"],{url:ax("2101.03961"),source:"Fedus 等",summary:"稀疏专家混合，让参数量与单次计算量解耦。",criteria:["新架构变体"]}),
 N("mamba","Mamba 状态空间模型","2023-12","arch",["transformer"],{url:ax("2312.00752"),source:"Gu & Dao",summary:"选择性状态空间模型，序列长度上线性复杂度，是 Transformer 的竞争路线之一。",criteria:["新架构"],status:"candidate",added_by:"agent",added_at:"2026-11-19",confidence:0.62,agent_reason:"架构路线上有代表性，但主流生成模型采用程度待确认；父节点关系（Transformer）为竞争而非继承，需人工判断。"}),
 // 语言模型
 N("gpt1","GPT-1","2018-06","llm",["transformer"],{kind:"release",source:"OpenAI",summary:"生成式预训练 + 下游微调，证明了“先预训练再迁移”的路线。",criteria:["新范式"]}),
 N("gpt2","GPT-2","2019-02","llm",["gpt1"],{kind:"release",source:"OpenAI",summary:"规模扩大后零样本生成能力明显出现。",criteria:["能力跃迁"]}),
 N("gpt3","GPT-3","2020-05-28","llm",["gpt2","scaling","azuresc"],{major:true,url:ax("2005.14165"),source:"Brown 等",summary:"175B 参数，展示了上下文学习（few-shot in-context learning）。",criteria:["能力跃迁"]}),
 N("chatgpt","ChatGPT","2022-11-30","consumer",["gpt3","instructgpt"],{major:true,kind:"release",source:"OpenAI",summary:"对话式产品形态让生成式 AI 进入大众视野。",criteria:["大规模采用"]}),
 N("llama","LLaMA","2023-02","llm",["gpt3","chinchilla"],{major:true,url:ax("2302.13971"),source:"Meta",summary:"高质量开放权重模型，催生了开源大模型生态。",criteria:["开源生态"]}),
 N("gpt4","GPT-4","2023-03-14","llm",["chatgpt","azuresc"],{major:true,url:ax("2303.08774"),source:"OpenAI",summary:"在大量专业考试和基准上大幅提升，支持图像输入。",criteria:["能力跃迁"]}),
